
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas Coffee - Contact</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <img src="img.png" width="80" alt="Atlas Coffee Logo">
        <h1>Atlas Coffee</h1>
    </header>

    <nav id="menu">
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="contact.html">Contact</a>
    </nav>

    <main>

        <h2>Contact Us</h2>

        <form action="contact.php" method="post">

            <label for="name">Name:</label>
            <input type="text" id="name" name="name"
                   required autofocus>

            <br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email"
                   required>

            <br><br>

            <p>Visit type:</p>

            <input type="radio" id="onsite" name="visit_type"
                   value="On site">
            <label for="onsite">On site</label>

            <input type="radio" id="takeaway" name="visit_type"
                   value="Takeaway">
            <label for="takeaway">Takeaway</label>

            <br><br>

            <label for="drink">Favorite drink:</label>

            <select id="drink" name="drink">
                <option value="Espresso">Espresso</option>
                <option value="Mint Tea">Mint Tea</option>
                <option value="Cappuccino">Cappuccino</option>
            </select>

            <br><br>

            <label for="message">Message:</label>

            <br>

            <textarea id="message" name="message"
                      rows="4" cols="40"></textarea>

            <br><br>

            <button type="submit">Send</button>
            <button type="reset">Reset</button>

        </form>

    </main>

    <footer>
        <p>Address: Avenue Hassan II, Agadir, Morocco</p>
        <p>
            Email:
            <a href="mailto:contact@atlascoffee.ma">
                contact@atlascoffee.ma
            </a>
        </p>
    </footer>

</body>

</html>
