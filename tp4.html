<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: rgb(255, 255, 255);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;

        }
        .form-box{
            background-color: white;
            padding: 40px;
            width: 600px;
            box-shadow: 0 4px 15px black;
            border-radius: 8px;
        }
       h1{
    color: #6b4c8c;
    text-align: center; 
    margin-bottom: 35px;    
    letter-spacing: 1px;
     font-weight: normal;
     background: linear-gradient(to right,#e05286,#a838e0);
     -webkit-background-clip: text;
     background-clip:text;
     -webkit-text-fill-color: transparent;
     color: transparent;
  }
       .row{
        display: flex;
        gap: 20px;
       }
       .col{
        flex: 1;
       }
       input{
        width: 100%;
        border: none;
        border-bottom: 1.5px solid #8e68b3;
        outline: none;
        padding: 10px 0;
        margin-bottom: 25px;
        font-size: 15px;
        background: transparent;
        color: #333;
           }
           input::placeholder{
            color: #7f8c8d;
           }
           button[type="submit"]{
            background: linear-gradient(135deg,#a83279,#1b3fa0);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 14px;
            border-radius: 3px;
            cursor: pointer;
            text-transform: uppercase;
           }
    </style>
</head>
<body>
    <div class="form-box">
    <h1>GET IN TOUCH</h1>
   
        <div class="row">
            <div class="col">
                <INPUT  type="text" placeholder="Name">
             </div>
             <div class="col">
                 <INPUT  type="email" placeholder="E-Mail">
             </div>
        </div>
        <div class="row">
         <div class="col">
                <INPUT  type="text" placeholder="Company Name">
             </div>
             <div class="col">
                 <INPUT  type="number" placeholder="Contact Number">
             </div>
        </div>
        <div>
            <input type="text" placeholder="Message">
        </div>
        <button type="submit">SUBMIT</button>
    </form>
</body>
</html>
