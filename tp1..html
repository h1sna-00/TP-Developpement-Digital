<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-image: url(img4.jpeg);
             background-position: center;
             background-repeat: no-repeat;
             background-size: cover;
             font-family: Arial, Helvetica, sans-serif;
             margin: 0;
             min-height: 100vh;
             display: flex;
             justify-content: center;
             align-items: center;
            padding: 30px;       
 }
        fieldset{
          color: rgb(30, 29, 28);
          background-color: white;
         width: 800px;
         padding: 60px;
         border-radius: 5px;
        
        }
       
        h2{
            text-align: center;
            margin-bottom: 35px;
             color: #333;
        }
        .a{
            display: flex;
             grid-template-columns: 1fr 1fr;
            gap: 25px;
        }
         
       textarea {
            height: 40px;
           width: 600px;
        }
      

        .full {
            grid-column: span 2;
           
        }
         button {
            background-color: #3478db;
            color: white;
            border: none;
            padding: 17px;
            width: 180px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            margin: 20px auto 0;
           
        }
         label {
            font-weight: bold;
            margin-bottom: 10px;
            color: #555;
        }
          @media screen and (max-width: 600px) {
            .container {
                width: 100%;
                padding: 25px;
            }

            .form {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: span 1;
            }
        }
        .input{
            width: 200px;
            height: 20px;
            border-radius: 5px;
            border: 1px solid black;
        }
    </style>
</head>
<body>

    <fieldset>
        <h2>Powering world-class companies</h2>
        <div class="a">
        <div class="contenaire">
        <label for="name">First name *</label><br>
        <input  class="input"  type="text" id="name" placeholder="Enter your first name"><br><br>
        <label for="email">Business email *</label><br>
        <input  class="input" type="email" id="email" ><br><br>
        <label for="job">Job title *</label><br>
        <input class="input"  type="text" id="job" ><br><br>
        <label>What would you be using Flinks for? *</label><br>
            <textarea required></textarea><br><br>
     </div>
    <div class="contenair">
        <label for="lname">Laste name *</label><br>
        <input class="input"  type="text" id="lname" placeholder="Enter your last name"><br><br>
        <label for="number">Phone number *</label><br>
        <input  class="input" type="text" id="number" ><br><br>
    </div>
   </div>
   <br>
   
   <button type="submit" class="full">
                REQUEST A DEMO
            </button>
   
    </fieldset>
</body>
</html>
