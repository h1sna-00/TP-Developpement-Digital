<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title> 
    
</head>
<body>
    
    <fieldset>
        <h1>Mon Premier Formulaire HTML5</h1>
        <form action="">
            <fieldset>
                <legend>Vos coordonnées</legend>
                Nom*:<input type="texte" name="Nom" placeholder="votre nom"><br>
                Prénom*:<input type="texte" name="Nom" placeholder="votre prenom"><br>
                Date de naissance:<input type="date" id="date" ><br>
                Mail:<input type="texte" name="mail" placeholder="votre mail"><br>
                Votre site:<input type="url" name="site" placeholder="http:/www."><br>
                Code:<input type="password" pattern="[A-Z]{2}[0-9]{4}[a-z]{2}" maxlength="8" minlength="8" ><br>
                <input type="radio" value="homme" name="genre">Homme<br>
                <input type="radio" value="femme" name="genre">Femme<br>
                <select>
                    <option>votre pays</option>
                    <option>maroc</option>
                    <option>france</option>
                    <option>chine</option>
                </select>
            </fieldset>
            <fieldset>
                <legend>Vos gouts</legend>
                <input name="gouts" type="checkbox" value="Pommes">Pommes<br>
                <input name="gouts" type="checkbox" value="Poires">Poires<br>
                <input name="gouts" type="checkbox" value="Scoubidous">Scoubidous<br>
                <textarea name="detail" id="detail" cols="50" rows="5" style="max-width: 100%;">
                Décrivez vos gouts en detail 
                </textarea>
            </fieldset>
            <fieldset>
                <legend>Envoyer nous votre photo</legend>
                <div> <input type="file"> </div><br>
                <input type="reset" value="Effacer">
                <input type="submit" value="Envoyer">
                
            </fieldset>
            
        </form>
    </fieldset>

</body>
</html>
