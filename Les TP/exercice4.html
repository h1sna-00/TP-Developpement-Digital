<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .hy{
    float: left;
    width: 200px;
    height: 150px;
    background-color: blue;
    padding: 10px;
    box-sizing: border-box;
}
.go{
    float: right;
     width: 200px;
    height: 150px;
    background-color: rgb(232, 32, 14);
    padding: 10px;
    box-sizing: border-box;
}
.bn{
    clear: both;
    text-align: center;
    padding-top: 50px;
    font-family: sans-serif;
}
    </style>
</head>
<body>
    <div class="hy">
        Boite gauche
    </div>
    <div class="go">
        Boite droite
    </div>
    <div class="bn">
        Text sous les deux boites
    </div>
</body>
</html>
