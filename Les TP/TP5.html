<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP5 - Navigation Bar</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Times New Roman", serif;
    background-color: white;
}

.hy {
    display: flex;
    justify-content: space-around;
    align-items: center;
    background-color: #293849;
    margin: 10px;
    height: 45px;
}

.hy a {
    color: white;
    text-decoration: none;
    font-size: 14px;
}

.hy a:hover {
    color: #cccccc;
}

.par {
    margin: 15px 14px;
    font-size: 14px;
}
    </style>
</head>
<body>

    <nav class="hy">
        <a href="#">Home</a>
        <a href="#">News</a>
        <a href="#">Contact</a>
        <a href="#">About</a>
    </nav>

    <p class="par">
        Note: We use href="#" for test links.
        In a real web site this would be URLs.
    </p>

</body>
</html>
