<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positionnement floattant</title>
    <style>
        div{
            border: 1px solid rgba(0, 0, 0, .3);
            text-align: center;
            color: #fff;
        }
        .box{
            background: #3498bd;
            margin: 5px;
            height: 40px;
            float: left;
        }
        .conteneur{
            overflow: auto;
        }
    </style>
</head>
<body>
    <div class="conteneur">
        <div class="box">bloc2</div>
        <div class="box">block3</div>
        <div class="box">block4</div>
    </div>
</body>
</html>
