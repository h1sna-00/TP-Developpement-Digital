<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
   margin: 0;
    height: 100vh;

    background-image: url(img6.jpg);
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    display: flex;
    justify-content: center;
    align-items: center;
}
.hy{
        width: 300px;
    padding: 25px;
    background-color: white;
box-sizing: border-box;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
  min-height: 120px;
    position: relative;
}
.go{
     margin-left: 90px;
     overflow: break-word;
     position: relative;
     z-index: 1;
}
.tof{
     width: 75px;
    height: 75px;

    border-radius: 50%;
    border: 3px solid white;

    position: absolute;
    top: -30px;
    left: 15px;

    

}
 h2{
         font-size: 18px;
    color: #333;
    margin: 0 0 10px;

    }
p{
       font-size: 12px;
    color: #666;
    line-height: 1.5;
    margin: 0;
    }
    </style>
</head>
<body>
    <div class="hy">
        <img src="img5.jpg" alt="image" class="tof">
    
    <div class="go">
        <h2>Mairie Dupont</h2>
        <p>Devellopeuse de web passionne  par le desing et les technologie front-end </p>
    </div>
    </div>
</body>
</html>
