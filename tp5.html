<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    fieldset{
         background-color: white;
            padding: 40px;
            width: 600px;
            box-shadow: 0 4px 15px black;
            border-radius: 8px;
            border: none;
    }
    body{
        font-family: Arial, Helvetica, sans-serif;
        justify-content: center;
        align-items: center;
        display: flex;
        margin: 0;
        height: 40vh;
    }
h1{
    text-align: center;
   color: #333;

}
.input{
width: 700px;
padding: 12px 40px 12px 12px;
border-radius: 4px;
border: 1px solid #ccc;
box-sizing: border-box;
outline: none;
font-size: 16px;
}
.input-container{
    position: relative;
    display: flex;
    align-items: center;
}
.eye-icon {
            position: absolute;
            right: 12px;
            background: #e2e8f0;
            border: none;
            padding: 6px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .eye-icon svg {
            width: 16px;
            height: 16px;
            fill: #475569;
        }
p{
    font-size: 13px;
    color: #666;
    margin-bottom: 25px;
}
button{
   background-color: green;
   color: white;
   border: none;
   border-radius: 5px;
    margin-left: auto;
     margin-right: auto;
   width: 70px;
   height: 40px;
   display: block;
}
label{
    display: block;
    color: #555;
    font-weight: bold;
}
  .strength-bar {
            background-color: #e2e8f0;
            border-radius: 4px;
            height: 16px;
            position: relative;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .strength-fill {
            background-color: #f59e0b;
            width: 50%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 11px;
            font-weight: bold;
        }

    </style>
</head>
<body>
    <fieldset>
     <h1>Enter the Password</h1>
     <label for="password">Password</label><br>
     <div class="input-container">
     <input class="input" type="password" id="password" value="••••••••••••••••••••">
     <button type="button" class="eye-icon">
        <svg viewBox="0 0 24 24"><path d="M11.83 9L15 12.17V12a3 3 0 0 0-3-3h-.17m-4.3 8l1.55-1.55C9.9 15.82 10.9 16 12 16a6 6 0 0 0 6-6c0-1.1-.18-2.1-.55-3.05L19.05 5.35l-1.41-1.41L3.51 19.05l1.41 1.41M12 6a6 6 0 0 1 6 6c0 .5-.08 1-.21 1.47l-3.32-3.32A3 3 0 0 0 9.85 9.35L6.92 6.42C8.18 6.15 9.9 6 12 6Z"/></path></svg>
     </button>
     </div>
     <p>Add 9 characters or more.lowercase letters.uppercase letters,numbers and symbols
        to make the password really strong!
     </p>
 <div class="strength-bar">
    <div class="strength-fill">Moderate</div>
 </div>
     <button type="submit">Submit</button>
    </fieldset>
</body>
</html>
