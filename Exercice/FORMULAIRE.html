<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
</head>
<body>
    <h1>Mon premier Formulaire HTML5</h1>
    <fieldset>
        <legend>Information Personnelle</legend>
        <label for="nom">Nom:</label>
        <input type="text" id="nom" name="nom"    required><br><br>
         <label for="prenom">Prenom:</label>
        <input type="text" id="prenom" name="prenom" required><br><br>
         <label for="email">Adresse electronique:</label>
        <input type="email" id="email" name="email"  required><br><br>
         <label for="date">Date de naissance:</label>
        <input type="date" id="date" name="date"   required><br><br>
         <label for="site">Page Personnelle:</label>
        <input type="url" id="site" name="site"    required><br><br>
         <label for="passe">Code secret:</label>
        <input type="password" id="passe" name="passe" size="40" maxlength="6" pattern="[A-Z]{2}[0-9]{4}[a-z]{2}"><br><br>
        <label>Sexe:</label>
        <input type="radio" id="homme" name="sexe" value="homme" >
        <label for="homme">Homme</label>
         <input type="radio" id="femme" name="sexe" value="femme" >
        <label for="femme">Femme</label><br>
       <br> <label for="pays">Pays:</label>
        <select id="pays" name="pays" size="1">
            <optgroup label="Europe">
                <option value="France">France</option>
                <option value="Belgique">Belgique</option>
                <option value="Italie">Italie</option>
                <option value="Allemagne">Allemang</option>
            </optgroup>
            <optgroup label="Amerique">
                <option value="USA">USA</option>
                <option value="Canada">Canada</option>
                <option value="Argentine">Argentine</option>
                <option value="Mexique">Mexique</option>
            </optgroup>
            <optgroup label="Autre">
                <option value="Afrique">Afrique</option>
                <option value="Asie">Asie</option>
                <option value="Oceanie">Oceanie</option>
                <option value="Australie">Australie</option>
            </optgroup>
        </select>
    </fieldset>
    <br>
    <fieldset>
        <legend>Option et Commentaires</legend>
        <input type="checkbox" id="c1" value="1">
        <label for="c1">Scoubidous</label><br>
         <input type="checkbox" id="c2" value="2">
        <label for="c2">Pommes</label><br>
         <input type="checkbox" id="c3" value="3">
        <label for="c3">Poirs</label><br>
         <label for="comm">Commentaire:</label><br>
         <textarea id="comm" cols="50" rows="5" >Decrivez vos gouts en detail</textarea>
    </fieldset>
    <br>
    <fieldset>
        <legend>Envoyer nous votre photo</legend>
        <label for="fiche"></label>
        <input type="file" for="fiche"><br>
       <br> <button type="reset">Effacer</button>
        <button type="submit">Envoyer</button>
    </fieldset>
</body>
</html>
