<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       div{
            width: 300px;
            height: 100px;
            background-color: cyan;
         border: 1px solid black;
        }
        .div1:hover{
            transform: translate(50px,100px);
        }
      
        .div2:hover{
            transform: rotate(20deg);
        }
        
        .div3:hover{
            transform: scale(2,3);
        }
       
        .div4:hover{
            transform: skew(20deg,10deg);
        }
         .div5:hover{
            transform: rotateX(60deg);
        }
        
    </style>
</head>
<body>
    <div class="div1"></div>
    <br>
     <div class="div2"></div>
     <br>
      <div class="div3"></div>
      <br>
       <div class="div4"></div>
       <br>
       <div class="div5"></div>
       <br>
       <div class="b"></div>
</body>
</html>
