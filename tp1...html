<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request a Demo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-image: url("https://images.unsplash.com/photo-1441974231531-c6227db76b6e");
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            background-color: white;
            width: 800px;
            padding: 60px;
            border-radius: 5px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 35px;
        }

        .form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 10px;
            color: #555;
        }

        input, textarea {
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 3px;
            font-size: 14px;
            width: 100%;
        }

        textarea {
            height: 150px;
            resize: vertical;
        }

        .full {
            grid-column: span 2;
        }

        button {
            background-color: #3478db;
            color: white;
            border: none;
            padding: 17px;
            width: 180px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            margin: 20px auto 0;
        }

        button:hover {
            background-color: #245bb0;
        }

        @media screen and (max-width: 600px) {
            .container {
                width: 100%;
                padding: 25px;
            }

            .form {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: span 1;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Powering world-class companies</h2>

        <form class="form">

            <div class="field">
                <label>First name *</label>
                <input type="text" placeholder="Enter your first name" required>
            </div>

            <div class="field">
                <label>Last name *</label>
                <input type="text" placeholder="Enter your last name" required>
            </div>

            <div class="field">
                <label>Business email *</label>
                <input type="email" required>
            </div>

            <div class="field">
                <label>Phone number *</label>
                <input type="tel" required>
            </div>

            <div class="field">
                <label>Job title *</label>
                <input type="text" required>
            </div>

            <div class="field full">
                <label>What would you be using Flinks for? *</label>
                <textarea required></textarea>
            </div>

            <button type="submit" class="full">
                REQUEST A DEMO
            </button>

        </form>

    </div>

</body>
</html>
